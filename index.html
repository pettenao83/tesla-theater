<!DOCTYPE html>
<html lang="it">
<head>
  <title>Tesla Theater</title>
  <meta http-equiv='content-type' content='text/html; charset=UTF-8' />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta property="og:title" content="Tesla Theater" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://fmossott.github.io/TeslaTheater/preview.jpg" />
  <meta property="og:url" content="https://bit.ly/TeslaTheater" />
  <meta property="og:alt" content="Tesla Theater" />
  <meta property="og:site_name" content="Tesla Theater" />
  <meta property="og:description" content="Pagina web per accedere alle piattaforme di streaming a schermo intero sul display Tesla." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:creator" content="@FMossotto" />
  <meta name="twitter:site" content="@FMossotto" />
  <meta name="twitter:title" content="Tesla Theater" />
  <meta name="twitter:description" content="Pagina web per accedere alle piattaforme di streaming a schermo intero sul display Tesla." />
  <meta name="twitter:image" content="https://fmossott.github.io/TeslaTheater/preview.jpg" />

  <script>window.gtag = window.gtag || function(){};</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- JQuery -->
  <link rel="stylesheet" href="//code.jquery.com/ui/1.13.0/themes/base/jquery-ui.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.0/jquery-ui.min.js"></script>
  <script src="js/jquery.ui.touch-punch.min.js"></script>

  <!-- Font awesome -->
  <script src="https://kit.fontawesome.com/39e55326bb.js" crossorigin="anonymous"></script>

  <!-- Custom (versioned to bust the browser cache on every deploy) -->
  <link rel="stylesheet" href="teslatheater.css?v=24">
  <script src="teslatheater.js?v=24"></script>
  <script src="iptv.js?v=24"></script>
</head>
<body>

  <div id="lock-screen">
    <form id="lock-form">
      <h1><img src="images/tesla-white.png" class="inline" alt="Tesla"/><span class="cyan">Theater</span></h1>
      <p class="lock-tagline">Inserisci il codice per accedere</p>
      <input type="password" inputmode="numeric" id="lock-pin" placeholder="Codice di accesso" autocomplete="off" />
      <button type="submit" id="lock-submit" class="actionbutton">Sblocca</button>
      <p id="lock-error" class="hidden">Codice errato, riprova.</p>
    </form>
  </div>

  <div id="app-root" class="hidden">
    <header id="app-header">
      <div class="marquee">
        <h1><img src="images/tesla-white.png" class="inline" alt="Tesla"/><span class="cyan">Theater</span></h1>
        <p class="tagline">Il tuo cinema privato, direttamente sullo schermo dell'auto</p>
      </div>

      <div id="toolbar">
        <button id="fullscreen" type="button" class="actionbutton"><em class="fas fa-expand"></em> Schermo intero</button>
        <button id="add-app-btn" type="button" class="actionbutton"><em class="fas fa-plus"></em> Aggiungi app</button>
        <button id="remove-app-btn" type="button" class="actionbutton"><em class="fas fa-trash"></em> Rimuovi app</button>
        <div id="zoom-control">
          <em class="fas fa-magnifying-glass-minus"></em>
          <input type="range" id="zoom-slider" min="0.6" max="1.6" step="0.05" value="1" />
          <em class="fas fa-magnifying-glass-plus"></em>
        </div>
        <button id="export-btn" type="button" class="actionbutton secondary"><em class="fas fa-upload"></em> Esporta</button>
        <button id="import-btn" type="button" class="actionbutton secondary"><em class="fas fa-download"></em> Importa</button>
        <button id="reset-defaults-btn" type="button" class="actionbutton secondary"><em class="fas fa-arrow-rotate-left"></em> Ripristina</button>
        <button id="lock-btn" type="button" class="actionbutton secondary"><em class="fas fa-lock"></em> Blocca</button>
      </div>
    </header>

    <div id="add-app-form" class="hidden">
      <input type="text" id="add-app-name" placeholder="Nome app" />
      <input type="text" id="add-app-url" placeholder="Indirizzo (es. netflix.com)" />
      <label id="add-app-img-label" for="add-app-img-file">
        <div id="add-app-img-preview" class="hidden"><img alt="Anteprima icona"/></div>
        <span id="add-app-img-placeholder"><em class="fas fa-image"></em> Carica icona (opzionale)</span>
      </label>
      <input type="file" id="add-app-img-file" accept="image/*" class="hidden" />
      <div class="add-app-actions">
        <div id="add-app-submit" class="actionbutton"><em class="fas fa-plus"></em> Aggiungi</div>
        <div id="add-app-cancel" class="actionbutton secondary"><em class="fas fa-xmark"></em> Annulla</div>
      </div>
      <p id="add-app-error" class="hidden"></p>
    </div>

    <div id="apps" class="container">
    </div>

    <section id="iptv-view" class="hidden" aria-label="IPTV">
      <div class="iptv-bar">
        <button id="iptv-home" type="button" class="actionbutton"><em class="fas fa-house"></em> Home</button>
        <select id="iptv-list-select" aria-label="Lista attiva"></select>
        <button id="iptv-toggle-channels" type="button" class="actionbutton secondary" title="Nascondi o mostra l'elenco dei canali"><em class="fas fa-table-columns"></em> <span>Nascondi canali</span></button>
        <button id="iptv-audio-btn" type="button" class="actionbutton secondary" title="Nasconde il video e lascia solo l'audio"><em class="fas fa-headphones"></em> <span>Solo audio</span></button>
        <button id="iptv-add-file" type="button" class="actionbutton secondary"><em class="fas fa-file-arrow-up"></em> Carica file</button>
        <button id="iptv-add-url" type="button" class="actionbutton secondary"><em class="fas fa-link"></em> Da indirizzo</button>
        <button id="iptv-refresh" type="button" class="actionbutton secondary hidden"><em class="fas fa-rotate"></em> Aggiorna</button>
        <button id="iptv-delete" type="button" class="actionbutton secondary hidden"><em class="fas fa-trash"></em> Elimina lista</button>
        <input type="file" id="iptv-file" class="hidden" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,application/x-mpegurl,application/vnd.apple.mpegurl,text/plain" />
      </div>

      <form id="iptv-url-form" class="hidden">
        <input type="text" id="iptv-url-name" placeholder="Nome (opzionale)" autocomplete="off" />
        <input type="text" id="iptv-url-address" placeholder="Indirizzo della lista (https://… oppure playlists/mia.m3u)" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button type="submit" class="actionbutton"><em class="fas fa-plus"></em> Scarica e aggiungi</button>
        <button type="button" id="iptv-url-cancel" class="actionbutton secondary">Annulla</button>
      </form>

      <p id="iptv-status" class="hidden"></p>

      <div class="iptv-main">
        <aside class="iptv-side">
          <div class="iptv-filters">
            <input type="search" id="iptv-search" placeholder="Cerca canale" autocomplete="off" />
            <select id="iptv-group" class="hidden" aria-label="Gruppo"></select>
          </div>
          <div class="iptv-prefs">
            <select id="iptv-sort" aria-label="Ordinamento">
              <option value="list">Ordine della lista</option>
              <option value="name">Nome A–Z</option>
              <option value="group">Per gruppo</option>
            </select>
            <button id="iptv-edit" type="button" class="actionbutton secondary" title="Riordina i preferiti"><em class="fas fa-arrows-up-down"></em> Preferiti</button>
            <button id="iptv-save-prefs" type="button" class="actionbutton hidden" title="Scarica il file da pubblicare per tutti"><em class="fas fa-floppy-disk"></em> Salva per tutti</button>
          </div>
          <div id="iptv-channels"></div>
        </aside>
        <div class="iptv-stage">
          <div class="iptv-player-wrap">
            <video id="iptv-video" controls autoplay playsinline></video>
            <div id="iptv-msg" class="hidden"></div>
            <div id="iptv-audio-card" class="hidden">
              <em class="fas fa-headphones"></em>
              <span id="iptv-audio-name">Solo audio</span>
              <button id="iptv-audio-play" type="button" aria-label="Pausa"><em class="fas fa-pause"></em></button>
            </div>
          </div>
          <p id="iptv-now">Seleziona un canale</p>
        </div>
      </div>
    </section>
  </div>

  <template id="site-template">
    <div link="https://link.com/" class="button">
      <div class="deleteswitch hidden" title="Rimuovi app">
        <em class="fas fa-trash"></em>
      </div>
      <div class="logo-container">
        <img alt="site name">
      </div>
    </div>
  </template>
</body>
</html>
